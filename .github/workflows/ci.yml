name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax-Check
        run: python3 -m py_compile indexer.py server.py link_report.py make_synth_vault.py
      - name: Synth-Vault erzeugen
        run: python3 make_synth_vault.py /tmp/synthvault 500
      - name: Tests
        run: python3 test_indexer.py
